<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquadEditor — macOS (Apple Silicon)</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0D1117; --surface: #141A23; --surface-2: #1B2330; --line: #263042;
      --ink: #EEF2F7; --ink-2: #9AA6B8; --ink-3: #647287; --accent: #4F8CFF; --green: #22C55E; --warn: #F59E0B;
    }
    [data-theme="light"] {
      --bg: #F6F5F1; --surface: #FFFFFF; --surface-2: #EFEEE9; --line: #E2E0D8;
      --ink: #14161A; --ink-2: #505866; --ink-3: #7D8594; --accent: #2563EB; --green: #15803D; --warn: #D97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 13.5px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { height: 52px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .brand { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 9px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .dot.off { background: #EF4444; }
    .status { font-size: 12px; color: var(--ink-2); }
    .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
    .tab { border: 0; background: transparent; color: var(--ink-2); padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
    .tab.active { background: var(--surface); color: var(--ink); }
    .bar-right { display: flex; align-items: center; gap: 7px; }
    .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #FFF; border-color: transparent; }
    .btn-green { background: rgba(34,197,94,0.16); color: var(--green); border-color: rgba(34,197,94,0.35); }
    .layout { flex: 1; display: grid; grid-template-columns: 430px 1fr; overflow: hidden; }
    .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
    .filters { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
    .input { width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; outline: none; }
    .input:focus { border-color: var(--accent); }
    .f-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: center; }
    .list { flex: 1; overflow-y: auto; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .row:hover { background: var(--surface-2); }
    .row.active { background: rgba(79,140,255,0.14); }
    .r-name { font-weight: 700; font-size: 13.5px; }
    .r-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
    .r-nums { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12.5px; }
    .ca { color: var(--green); } .pa { color: var(--accent); }
    .right { overflow-y: auto; padding: 20px 24px; }
    .empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 14px; }
    .ent-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .ent-title { font-size: 22px; font-weight: 800; }
    .quick-bar { display: flex; gap: 7px; flex-wrap: wrap; }
    .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .card-h { padding: 9px 13px; border-bottom: 1px solid var(--line); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
    .f-item { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 8px; padding: 6px 13px; border-bottom: 1px solid var(--line); }
    .f-item:last-child { border-bottom: 0; }
    .f-item label { font-size: 12.5px; color: var(--ink-2); }
    .f-item input { width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .f-item input:disabled { opacity: 0.65; border-color: transparent; background: transparent; }
    .toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; font-weight: 600; font-size: 12.5px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .left { max-height: 44vh; border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot" id="connDot"></span>
      <span>SquadEditor</span>
      <span class="status" id="statusText">Connecting…</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-t="Player">Players</button>
      <button class="tab" data-t="Club">Clubs</button>
      <button class="tab" data-t="Staff">Staff</button>
      <button class="tab" data-t="Competition">Leagues</button>
    </div>
    <div class="bar-right">
      <button class="btn" id="undoBtn">Undo (0)</button>
      <button class="btn" id="reloadBtn">Reload</button>
      <button class="btn" id="themeBtn">Theme</button>
    </div>
  </header>

  <div class="layout">
    <aside class="left">
      <div class="filters">
        <input class="input" id="q" placeholder="Search name, club, nation…" />
        <div class="f-row" id="playerFilters">
          <input class="input" id="minCa" type="number" placeholder="Min CA" />
          <input class="input" id="minPa" type="number" placeholder="Min PA" />
          <label style="font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer;"><input type="checkbox" id="freeOnly" /> Free</label>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main class="right" id="detail">
      <div class="empty">Select a player, club, staff or league to inspect &amp; edit live.</div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    let curType = "Player", curAddr = null, curLabel = "", debounce = null;
    const toast = m => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2000); };

    async function refreshStatus() {
      const s = await (await fetch("/api/status")).json();
      document.getElementById("connDot").className = "dot" + (s.connected ? "" : " off");
      document.getElementById("statusText").textContent = s.status;
      document.getElementById("undoBtn").textContent = `Undo (${s.undoCount})`;
    }

    async function loadList() {
      const q = encodeURIComponent(document.getElementById("q").value.trim());
      let url = curType === "Player"
        ? `/api/players?q=${q}&minCa=${document.getElementById("minCa").value}&minPa=${document.getElementById("minPa").value}&free=${document.getElementById("freeOnly").checked ? 1 : 0}`
        : curType === "Club" ? `/api/clubs?q=${q}`
        : curType === "Staff" ? `/api/staff?q=${q}` : `/api/comps?q=${q}`;
      const rows = await (await fetch(url)).json();
      const el = document.getElementById("list");
      el.innerHTML = rows.map(r => {
        const sub = curType === "Player" ? `${r.club || "Free Agent"} · ${r.nation}`
          : curType === "Club" ? `Rep ${r.rep} · Bal £${(r.balance/1e6).toFixed(1)}M`
          : curType === "Staff" ? `${r.club || "Free"} · ${r.nation}` : `Rep ${r.rep}`;
        const nums = (curType === "Player" || curType === "Staff")
          ? `<span class="ca">${r.ca}</span> / <span class="pa">${r.pa}</span>`
          : `<span>${r.rep}</span>`;
        return `<div class="row ${curAddr === r.addr ? "active" : ""}" data-a="${r.addr}" data-n="${r.name.replace(/"/g,'&quot;')}">
          <div><div class="r-name">${r.name}</div><div class="r-sub">${sub}</div></div>
          <div class="r-nums">${nums}</div>
        </div>`;
      }).join("");
      el.querySelectorAll(".row").forEach(r => r.onclick = () => openEntity(curType, r.dataset.a, r.dataset.n));
    }

    async function openEntity(type, addr, label) {
      curAddr = addr; curLabel = label;
      document.querySelectorAll(".row").forEach(r => r.classList.toggle("active", r.dataset.a === addr));
      const data = await (await fetch(`/api/entity?type=${type}&addr=${addr}`)).json();
      if (data.error) { toast(data.error); return; }

      const grouped = {};
      for (const f of data.fields) { (grouped[f.group] ||= []).push(f); }

      const quickBtns = type === "Player"
        ? `<button class="btn btn-green" onclick="quick('max_fitness')">Max Fitness &amp; Morale</button>
           <button class="btn" onclick="quick('toggle_freeze')">${data.frozen ? "Unfreeze" : "Freeze"}</button>`
        : type === "Club"
        ? `<button class="btn btn-green" onclick="quick('rich_club')">Rich Owner (+500M / +200M)</button>
           <button class="btn" onclick="quick('max_facilities')">Max All Facilities (20)</button>` : "";

      document.getElementById("detail").innerHTML = `
        <div class="ent-head">
          <div class="ent-title">${label}</div>
          <div class="quick-bar">${quickBtns}</div>
        </div>
        <div class="groups">
          ${Object.entries(grouped).map(([g, list]) => `
            <div class="card">
              <div class="card-h">${g}</div>
              ${list.map(f => `
                <div class="f-item">
                  <label>${f.name}</label>
                  <input value="${String(f.value).replace(/"/g,'&quot;')}" ${f.writable ? "" : "disabled"} data-fn="${f.name.replace(/"/g,'&quot;')}" />
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
      `;

      document.querySelectorAll("#detail input[data-fn]").forEach(inp => {
        inp.onchange = async () => {
          const res = await (await fetch("/api/write", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type, addr, field: inp.dataset.fn, value: inp.value, label })
          })).json();
          if (res.ok) { toast(`Saved ${inp.dataset.fn}`); refreshStatus(); }
          else toast(res.error || "Write failed");
        };
      });
    }

    async function quick(action) {
      const res = await (await fetch("/api/quick", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: curType, addr: curAddr, action, label: curLabel })
      })).json();
      if (res.ok) { toast("Applied!"); refreshStatus(); openEntity(curType, curAddr, curLabel); }
      else toast(res.error || "Failed");
    }

    document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
      curType = b.dataset.t; curAddr = null;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === b));
      document.getElementById("playerFilters").style.display = curType === "Player" ? "grid" : "none";
      loadList();
    });

    ["q", "minCa", "minPa", "freeOnly"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(loadList, 140); });
    });

    document.getElementById("undoBtn").onclick = async () => {
      await fetch("/api/undo", { method: "POST" });
      toast("Undone"); refreshStatus();
      if (curAddr) openEntity(curType, curAddr, curLabel);
    };
    document.getElementById("reloadBtn").onclick = async () => {
      toast("Reconnecting…");
      await fetch("/api/reconnect", { method: "POST" });
      await refreshStatus(); await loadList();
      toast("Reloaded");
    };
    document.getElementById("themeBtn").onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
    };
    document.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); document.getElementById("undoBtn").click(); }
    });

    refreshStatus().then(loadList);
  </script>
</body>
</html>
