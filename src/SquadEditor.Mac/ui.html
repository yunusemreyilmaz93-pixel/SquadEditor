<!doctype html>
<html lang="tr" data-theme="wtcs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SquadEditor — FM27</title>
<style>
  :root, [data-theme="wtcs"] {
    --bg: #13161C;
    --bg-elev: #191D25;
    --card: #1F242E;
    --card-2: #262C38;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #F3F4F6;
    --text-2: #D1D5DB;
    --muted: #8B93A1;
    --accent: #EAB308;
    --accent-ink: #111318;
    --accent-soft: rgba(234, 179, 8, 0.16);
    --emerald: #22C55E;
    --emerald-soft: rgba(34, 197, 94, 0.15);
    --blue: #38BDF8;
    --danger: #EF4444;
    --attr-hi: #22C55E;
    --attr-mid: #38BDF8;
    --attr-low: #F59E0B;
    --attr-dim: #EF4444;
    --row-hover: rgba(255, 255, 255, 0.04);
    --row-active: rgba(234, 179, 8, 0.13);
  }
  [data-theme="navy"] {
    --bg: #0B1120;
    --bg-elev: #111827;
    --card: #161F33;
    --card-2: #1E2942;
    --border: rgba(148, 163, 184, 0.14);
    --border-strong: rgba(148, 163, 184, 0.26);
    --text: #F1F5F9;
    --text-2: #CBD5E1;
    --muted: #8B9BB4;
    --accent: #3B82F6;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(59, 130, 246, 0.18);
    --emerald: #22C55E;
    --emerald-soft: rgba(34, 197, 94, 0.15);
    --blue: #38BDF8;
    --danger: #EF4444;
    --attr-hi: #34D399;
    --attr-mid: #38BDF8;
    --attr-low: #FBBF24;
    --attr-dim: #F87171;
    --row-hover: rgba(59, 130, 246, 0.09);
    --row-active: rgba(59, 130, 246, 0.18);
  }
  [data-theme="oled"] {
    --bg: #000000;
    --bg-elev: #0A0A0D;
    --card: #121216;
    --card-2: #1A1A20;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.22);
    --text: #FAFAFA;
    --text-2: #D4D4D8;
    --muted: #71717A;
    --accent: #EAB308;
    --accent-ink: #000000;
    --accent-soft: rgba(234, 179, 8, 0.18);
    --emerald: #4ADE80;
    --emerald-soft: rgba(74, 222, 128, 0.15);
    --blue: #38BDF8;
    --danger: #F87171;
    --attr-hi: #4ADE80;
    --attr-mid: #38BDF8;
    --attr-low: #FBBF24;
    --attr-dim: #F87171;
    --row-hover: rgba(255, 255, 255, 0.05);
    --row-active: rgba(234, 179, 8, 0.16);
  }
  [data-theme="light"] {
    --bg: #F3F4F6;
    --bg-elev: #FFFFFF;
    --card: #FFFFFF;
    --card-2: #F1F5F9;
    --border: rgba(15, 23, 42, 0.10);
    --border-strong: rgba(15, 23, 42, 0.20);
    --text: #0F172A;
    --text-2: #334155;
    --muted: #64748B;
    --accent: #D97706;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(217, 119, 6, 0.14);
    --emerald: #059669;
    --emerald-soft: rgba(5, 150, 105, 0.12);
    --blue: #0284C7;
    --danger: #DC2626;
    --attr-hi: #059669;
    --attr-mid: #0284C7;
    --attr-low: #D97706;
    --attr-dim: #DC2626;
    --row-hover: rgba(15, 23, 42, 0.04);
    --row-active: rgba(217, 119, 6, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; font-size: 12.5px; -webkit-font-smoothing: antialiased; }

  .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

  /* TOP BAR — Exact Windows Veritabanı Header */
  .topbar {
    height: 54px; flex: 0 0 54px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px; background: var(--bg-elev); border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-logo { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
  .tb-title-box { display: flex; flex-direction: column; min-width: 0; }
  .tb-title { font-weight: 800; font-size: 14.5px; letter-spacing: -0.015em; line-height: 1.1; }
  .tb-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 5px; vertical-align: middle; }
  .dot.ok { background: var(--emerald); }

  /* Center Pill Navigation (like Windows: Oyuncular | Personel | Kulüpler | Ligler) */
  .nav-pills { display: flex; align-items: center; gap: 4px; background: var(--bg); padding: 3px; border-radius: 9px; border: 1px solid var(--border); }
  .nav-pill {
    padding: 6px 13px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all .12s;
  }
  .nav-pill:hover { color: var(--text); background: var(--row-hover); }
  .nav-pill.active { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .tb-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .search-box {
    width: 190px; height: 30px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 12px; outline: none; font-family: inherit;
  }
  .search-box:focus { border-color: var(--accent); }

  .btn, select.ctrl {
    height: 30px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: all .12s; font-family: inherit; white-space: nowrap;
  }
  .btn:hover, select.ctrl:hover { border-color: var(--border-strong); background: var(--card-2); }
  .btn.gold { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.gold:hover { filter: brightness(1.06); }
  .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.emerald { background: var(--emerald-soft); border-color: rgba(34,197,94,.35); color: var(--emerald); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  select.ctrl { outline: none; padding-right: 18px; }

  /* MAIN AREA */
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* === HOME / DATABASE VIEW === */
  .db-view { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 14px; gap: 10px; }

  .filter-bar {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .f-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
  .f-num {
    width: 60px; height: 28px; padding: 0 6px; text-align: center; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 12px; outline: none; font-family: inherit;
  }
  .f-num:focus { border-color: var(--accent); }
  .chip {
    height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-2);
    font-size: 11.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }

  .db-body { flex: 1; min-height: 0; display: flex; gap: 12px; overflow: hidden; }
  .table-card {
    flex: 1; min-width: 0; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 10px; overflow: auto;
  }
  table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.grid thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--card); color: var(--muted);
    font-size: 11px; font-weight: 700; padding: 9px 10px; text-align: left;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.grid tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .08s; }
  table.grid tbody tr:hover { background: var(--row-hover); }
  table.grid tbody tr.active { background: var(--row-active); }
  table.grid td { padding: 8px 10px; vertical-align: middle; white-space: nowrap; }
  .td-name { font-weight: 600; color: var(--text); }
  .td-muted { color: var(--text-2); }
  .td-ca { font-weight: 700; color: var(--emerald); font-variant-numeric: tabular-nums; }
  .td-pa { font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
  .star-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--muted); padding: 0 2px; }
  .star-btn.on { color: var(--accent); }

  /* RIGHT PREVIEW CARD (Exact Windows shot_home_db.png right card!) */
  .preview-card {
    width: 270px; flex: 0 0 270px; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    overflow: auto;
  }
  .preview-card.hidden { display: none; }
  .pv-head { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: #3B321C; border: 1px solid rgba(234,179,8,.35); color: #FDE68A;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
  }
  .pv-name { font-size: 14.5px; font-weight: 800; line-height: 1.2; }
  .pv-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .pv-club { font-size: 11.5px; color: var(--accent); font-weight: 600; }
  .capa-bar-wrap { display: flex; flex-direction: column; gap: 4px; }
  .capa-bar-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .capa-bar { height: 5px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
  .capa-fill { height: 100%; background: var(--emerald); border-radius: 999px; }
  .pv-kv { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .pv-kv span:first-child { color: var(--muted); }
  .pv-kv span:last-child { font-weight: 700; color: var(--text); }

  /* === FULL-WIDTH PROFILE VIEW (Exact Windows shot_player_overview.png!) === */
  .profile-view { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 20px; display: none; flex-direction: column; gap: 12px; }
  .profile-view.active { display: flex; }

  .p-hero {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .p-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .p-hero-id { display: flex; align-items: center; gap: 12px; }
  .p-hero-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .p-hero-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .p-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .p-pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; text-align: center; min-width: 96px;
  }
  .p-pill .v { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .p-pill .k { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .p-actions { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--border); }

  /* 4-Column Windows Attribute Grid */
  .p-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
  @media (max-width: 1100px) { .p-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .p-col { display: flex; flex-direction: column; gap: 12px; }

  .panel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .panel-h {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 8px; padding-left: 8px; border-left: 3px solid var(--accent);
    display: flex; align-items: center; justify-content: space-between;
  }
  .attr-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 3px 6px; border-radius: 5px;
  }
  .attr-row:hover { background: var(--row-hover); }
  .attr-name { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attr-val {
    width: 40px; height: 23px; text-align: center; font-weight: 800; font-size: 12px;
    border-radius: 4px; border: 1px solid transparent; background: var(--card);
    font-variant-numeric: tabular-nums; outline: none; font-family: inherit;
  }
  .attr-val:focus { border-color: var(--accent); }
  .a-hi { color: var(--attr-hi); }
  .a-mid { color: var(--attr-mid); }
  .a-low { color: var(--attr-low); }
  .a-dim { color: var(--attr-dim); }
  .proj { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 3px; }

  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kv-edit { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .kv-edit:last-child { border-bottom: none; }
  .kv-edit label { font-size: 12px; color: var(--muted); }
  .kv-edit input {
    width: 118px; height: 25px; text-align: right; font-weight: 700; font-size: 12px;
    border-radius: 5px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 0 7px; outline: none; font-family: inherit;
  }
  .kv-edit input:focus { border-color: var(--accent); }

  /* Club KPI & Facilities */
  .kpi-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi-box { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi-box .k { font-size: 11px; color: var(--muted); font-weight: 600; }
  .kpi-box .v { font-size: 18px; font-weight: 800; margin-top: 4px; }
  .fac-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .fac-lbl { width: 155px; font-size: 12px; color: var(--text-2); }
  .fac-bar { flex: 1; height: 7px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
  .fac-fill { height: 100%; background: var(--accent); border-radius: 999px; }

  /* SETTINGS MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: 440px; max-width: 92vw; background: var(--bg-elev); border: 1px solid var(--border-strong);
    border-radius: 14px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-h { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 800; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .set-row:last-child { border-bottom: none; }
  .set-lbl strong { display: block; font-size: 13px; }
  .set-lbl span { font-size: 11.5px; color: var(--muted); }

  .toast {
    position: fixed; bottom: 16px; right: 18px; z-index: 99;
    padding: 9px 14px; border-radius: 9px;
    background: var(--card-2); border: 1px solid var(--border-strong); color: var(--text);
    font-size: 12px; font-weight: 600; box-shadow: 0 10px 28px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: all .16s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); }
</style>
</head>
<body>
<div class="app">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="tb-left">
      <button class="btn" id="btnBack" style="display:none" onclick="closeProfile()">← <span data-i18n="back">Geri</span></button>
      <img src="/logo.png" class="brand-logo" alt="SquadEditor" />
      <div class="tb-title-box">
        <span class="tb-title" id="topTitle">Veritabanı</span>
        <span class="tb-sub"><span class="dot" id="statusDot"></span><span id="statusText">Bağlanıyor…</span></span>
      </div>
    </div>

    <nav class="nav-pills" id="navPills">
      <button class="nav-pill active" data-tab="players" onclick="switchTab('players')" data-i18n="players">Oyuncular</button>
      <button class="nav-pill" data-tab="staff" onclick="switchTab('staff')" data-i18n="staff">Personel</button>
      <button class="nav-pill" data-tab="clubs" onclick="switchTab('clubs')" data-i18n="clubs">Kulüpler</button>
      <button class="nav-pill" data-tab="comps" onclick="switchTab('comps')" data-i18n="comps">Ligler</button>
    </nav>

    <div class="tb-right">
      <input class="search-box" id="globalSearch" placeholder="Ara..." oninput="onSearchInput(this.value)" />
      <button class="btn" id="btnUndo" onclick="doUndo()" disabled title="⌘Z">↩ <span id="undoCount">0</span></button>
      <button class="btn" onclick="reconnect()" title="Yenile">↻</button>
      <button class="btn" onclick="openSettings()" title="Ayarlar">⚙ <span data-i18n="settings">Ayarlar</span></button>
    </div>
  </header>

  <main class="main">
    <!-- DATABASE / HOME VIEW -->
    <section class="db-view" id="dbView">
      <div class="filter-bar" id="filterBar"></div>
      <div class="db-body">
        <div class="table-card">
          <table class="grid">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <aside class="preview-card" id="previewCard"></aside>
      </div>
    </section>

    <!-- FULL-WIDTH PROFILE VIEW -->
    <section class="profile-view" id="profileView"></section>
  </main>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-h">
      <span>⚙ <span data-i18n="settings">Ayarlar</span></span>
      <button class="btn" onclick="closeSettings()">✕</button>
    </div>
    <div class="set-row">
      <div class="set-lbl"><strong data-i18n="theme">Tema</strong><span data-i18n="themeDesc">Uygulama renk görünümü</span></div>
      <select class="ctrl" id="selTheme" onchange="setTheme(this.value)">
        <option value="wtcs">WTCS Charcoal &amp; Gold</option>
        <option value="navy">FM Night Navy</option>
        <option value="oled">OLED Pure Black</option>
        <option value="light">Light Editorial</option>
      </select>
    </div>
    <div class="set-row">
      <div class="set-lbl"><strong data-i18n="language">Dil</strong><span data-i18n="langDesc">Arayüz dili (TR / EN)</span></div>
      <select class="ctrl" id="selLang" onchange="setLang(this.value)">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="set-row">
      <div class="set-lbl"><strong data-i18n="weightMode">Rol Ağırlık Modu</strong><span data-i18n="weightDesc">Klasik FM veya Maç Motoru (ME Meta)</span></div>
      <select class="ctrl" id="selWeight" onchange="setWeightMode(this.value)">
        <option value="classic">Classic FM</option>
        <option value="meta">ME Meta</option>
      </select>
    </div>
    <div class="set-row">
      <div class="set-lbl"><strong data-i18n="readOnly">Salt Okunur Mod</strong><span data-i18n="roDesc">Yanlışlıkla değişiklik yapılmasını engeller</span></div>
      <button class="btn" id="btnRoModal" onclick="toggleReadOnly()">Kapalı</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const I18N = {
  tr: {
    dbTitle: 'Veritabanı', back: 'Geri', players: 'Oyuncular', staff: 'Personel', clubs: 'Kulüpler', comps: 'Ligler',
    settings: 'Ayarlar', theme: 'Tema', themeDesc: 'Uygulama renk görünümü', language: 'Dil', langDesc: 'Arayüz dili (TR / EN)',
    weightMode: 'Rol Ağırlık Modu', weightDesc: 'Klasik FM veya Maç Motoru (ME Meta)', readOnly: 'Salt Okunur Mod', roDesc: 'Yanlışlıkla değişiklik yapılmasını engeller',
    searchPh: 'Oyuncu, kulüp, ülke ara...', pos: 'Mevki', all: 'Tümü', maxAge: 'Max Yaş', minCa: 'CA ≥', minPa: 'PA ≥', maxVal: 'Değer ≤M€',

let lang = localStorage.getItem('se_lang') || 'tr';
let theme = localStorage.getItem('se_theme') || 'wtcs';
let tab = 'players';
let weightMode = 'classic';
let readOnly = false;
let showPreview = true;
let currentRows = [];
let previewRow = null;
let currentEntity = null;
let paPreview = false;
let shortlistOnly = false;
let activePreset = '';
let staffMinStars = 0;
let searchTimer = null;
const shortlist = new Set(JSON.parse(localStorage.getItem('se_shortlist') || '[]'));
const f = { q: '', pos: '', maxAge: '', minCa: '', minPa: '', maxValM: '', free: false, sort: 'ca' };

function t(k) { return (I18N[lang] && I18N[lang][k]) || k; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtMoney(n) {
  const v = Number(n || 0);
  if (Math.abs(v) >= 1e9) return '€' + (v / 1e9).toFixed(2) + 'B';
  if (Math.abs(v) >= 1e6) return '€' + (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return '€' + (v / 1e3).toFixed(0) + 'K';
  return '€' + v;
}
function initials(name) {
  const p = String(name || '?').trim().split(/\s+/);
  return ((p[0]?.[0] || '') + (p[p.length - 1]?.[0] || '')).toUpperCase() || '?';
}
function attrClass(v) {
  const n = Number(v);
  if (n >= 16) return 'a-hi';
  if (n >= 12) return 'a-mid';
  if (n >= 8) return 'a-low';
  return 'a-dim';
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2100);
}
async function api(url, opts) { return await (await fetch(url, opts)).json(); }

function setTheme(v) {
  theme = v;
  document.documentElement.setAttribute('data-theme', v);
  document.getElementById('selTheme').value = v;
  localStorage.setItem('se_theme', v);
}
function setLang(v) {
  lang = v;
  document.getElementById('selLang').value = v;
  localStorage.setItem('se_lang', v);
  applyI18n();
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById('globalSearch').placeholder = t('searchPh');
  document.getElementById('btnRoModal').textContent = readOnly ? t('on') : t('off');
  document.getElementById('btnRoModal').classList.toggle('gold', readOnly);
  if (!currentEntity) document.getElementById('topTitle').textContent = t('dbTitle');
  renderFilterBar();
  renderTable();
  renderPreview();
  if (currentEntity) renderProfile(currentEntity);
}

function openSettings() {
  document.getElementById('selTheme').value = theme;
  document.getElementById('selLang').value = lang;
  document.getElementById('selWeight').value = weightMode;
  document.getElementById('btnRoModal').textContent = readOnly ? t('on') : t('off');
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

async function setWeightMode(v) {
  const r = await api('/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ weightMode: v }) });
  weightMode = r.weightMode;
  await loadList();
  toast(weightMode === 'meta' ? '⚡ ME Meta' : '⚖️ Classic FM');
}
async function toggleReadOnly() {
  const r = await api('/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ readOnly: !readOnly }) });
  readOnly = !!r.readOnly;
  document.getElementById('btnRoModal').textContent = readOnly ? t('on') : t('off');
  document.getElementById('btnRoModal').classList.toggle('gold', readOnly);
  if (currentEntity) await openProfile(currentEntity.type, currentEntity.addr);
}

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    document.getElementById('statusDot').classList.toggle('ok', !!s.connected);
    document.getElementById('statusText').textContent = s.connected
      ? `${(s.players||0).toLocaleString()} ${t('players').toLowerCase()} · ${(s.staff||0).toLocaleString()} ${t('staff').toLowerCase()} · ${(s.clubs||0).toLocaleString()} ${t('clubs').toLowerCase()}`
      : (s.status || '');
    document.getElementById('undoCount').textContent = s.undoCount || 0;
    document.getElementById('btnUndo').disabled = !(s.undoCount > 0);
    weightMode = s.weightMode || 'classic';
    readOnly = !!s.readOnly;
  } catch {}
}

async function reconnect() {
  await api('/api/reconnect', { method: 'POST' });
  await refreshStatus();
  await loadList();
  toast(t('reconnected'));
}

async function doUndo() {
  const r = await api('/api/undo', { method: 'POST' });
  document.getElementById('undoCount').textContent = r.undoCount || 0;
  document.getElementById('btnUndo').disabled = !(r.undoCount > 0);
  if (currentEntity) await openProfile(currentEntity.type, currentEntity.addr);
  toast(t('undone'));
}

function switchTab(next) {
  tab = next;
  closeProfile();
  document.querySelectorAll('.nav-pill').forEach(b => b.classList.toggle('active', b.dataset.tab === next));
  f.q = '';
  document.getElementById('globalSearch').value = '';
  renderFilterBar();
  loadList();
}

function onSearchInput(val) {
  f.q = val;
  if (currentEntity) closeProfile();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadList, 130);
}

function onFilter() {
  f.pos = document.getElementById('fPos')?.value || '';
  f.maxAge = document.getElementById('fAge')?.value || '';
  f.minCa = document.getElementById('fCa')?.value || '';
  f.minPa = document.getElementById('fPa')?.value || '';
  f.maxValM = document.getElementById('fVal')?.value || '';
  f.sort = document.getElementById('fSort')?.value || 'ca';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadList, 130);
}
function applyPreset(p) {
  shortlistOnly = false; activePreset = p;
  f.free = false; f.maxAge = ''; f.minCa = ''; f.minPa = ''; f.maxValM = '';
  if (p === 'moneyball') { f.maxAge = '25'; f.maxValM = '15'; f.sort = 'pr'; }
  else if (p === 'wonderkid') { f.maxAge = '20'; f.minPa = '155'; f.sort = 'pa'; }
  else if (p === 'free') { f.free = true; f.sort = 'ca'; }
  renderFilterBar(); loadList();
}
function resetFilters() {
  shortlistOnly = false; activePreset = '';
  Object.assign(f, { q: '', pos: '', maxAge: '', minCa: '', minPa: '', maxValM: '', free: false, sort: 'ca' });
  document.getElementById('globalSearch').value = '';
  renderFilterBar(); loadList();
}

async function loadList() {
  let url = '';
  if (tab === 'players') {
    const p = new URLSearchParams();
    if (f.q) p.set('q', f.q);
    if (f.pos) p.set('pos', f.pos);
    if (f.maxAge) p.set('maxAge', f.maxAge);
    if (f.minCa) p.set('minCa', f.minCa);
    if (f.minPa) p.set('minPa', f.minPa);
    if (f.maxValM) p.set('maxValM', f.maxValM);
    if (f.free) p.set('free', '1');
    p.set('sort', f.sort);
    url = '/api/players?' + p.toString();
  } else if (tab === 'clubs') url = '/api/clubs?q=' + encodeURIComponent(f.q);
  else if (tab === 'staff') url = `/api/staff?q=${encodeURIComponent(f.q)}&minStars=${staffMinStars}`;
  else url = '/api/comps?q=' + encodeURIComponent(f.q);
  currentRows = await api(url);
  if (tab === 'players' && currentRows.length && (!previewRow || !currentRows.some(r => r.addr === previewRow.addr))) {
    previewRow = currentRows[0];
  }
  renderTable();
  renderPreview();
}

function toggleShortlist(uid, ev) {
  if (ev) ev.stopPropagation();
  if (!uid) return;
  if (shortlist.has(uid)) shortlist.delete(uid); else shortlist.add(uid);
  localStorage.setItem('se_shortlist', JSON.stringify([...shortlist]));
  renderFilterBar(); renderTable(); renderPreview();
  if (currentEntity) renderProfile(currentEntity);
}

    tb.innerHTML = rows.map(r => `
      <tr onclick="openProfile('Staff','${r.addr}')">

function selectPreview(addr) {
  previewRow = currentRows.find(r => r.addr === addr) || null;

function exportCsv() {
  if (!currentRows.length) return;
  const cols = ['name','pos','age','club','nation','ca','pa','bestRole','rolePct','prPct','value','wage','contractEnd'];
  const lines = [cols.join(',')].concat(currentRows.map(r => cols.map(c => `"${String(r[c]??'').replace(/"/g,'""')}"`).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'squadeditor-scout.csv';
  a.click();
}

async function openProfile(type, addr) {
  const data = await api(`/api/entity?type=${encodeURIComponent(type)}&addr=${encodeURIComponent(addr)}`);
  if (data.error) { toast(data.error); return; }
  currentEntity = data;
  document.getElementById('dbView').style.display = 'none';
  document.getElementById('profileView').classList.add('active');
  document.getElementById('btnBack').style.display = 'inline-flex';
  const name = (data.fields || []).find(x => x.name === 'Name')?.value || data.addr;
  document.getElementById('topTitle').textContent = name;
  renderProfile(data);
}

function closeProfile() {
  currentEntity = null;
  document.getElementById('profileView').classList.remove('active');
  document.getElementById('dbView').style.display = 'flex';
  document.getElementById('btnBack').style.display = 'none';
  document.getElementById('topTitle').textContent = t('dbTitle');
}

async function writeField(type, addr, field, val, label) {
  if (readOnly) { toast('🔒 ' + t('readOnly')); return; }
  const r = await api('/api/write', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ type, addr, field, value: String(val), label }) });
  if (r.error) { toast(r.error); return; }
  document.getElementById('undoCount').textContent = r.undoCount || 0;
  document.getElementById('btnUndo').disabled = !(r.undoCount > 0);
  toast(`${t('saved')}: ${field} = ${val}`);
}

async function runQuick(type, addr, action, label) {
  if (readOnly) { toast('🔒 ' + t('readOnly')); return; }
  const r = await api('/api/quick', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ type, addr, action, label }) });
  if (r.error) { toast(r.error); return; }
  document.getElementById('undoCount').textContent = r.undoCount || 0;
  document.getElementById('btnUndo').disabled = !(r.undoCount > 0);
  await openProfile(type, addr);
  toast(t('saved'));
}

function buildRadarSvg(fmap, ca, pa, isGk) {
  const n = k => Number(fmap[k] || 10);
  const gain = Math.max(0, (pa - ca) * 0.42 / 5.0);
  const axes = isGk ? [
    ['Reflex', n('Reflexes')], ['Hand', n('Handling')], ['Aerial', n('Aerial Reach')], ['Cmd', n('Command of Area')],
    ['1v1', n('One on Ones')], ['Pos', n('Positioning')], ['Agi', n('Agility')], ['Mental', (n('Concentration')+n('Decisions'))/2]
  ] : [
    [lang==='tr'?'Hücum':'Attack', (n('Finishing')+n('Off the Ball')+n('Composure'))/3],
    [lang==='tr'?'Teknik':'Tech', (n('Dribbling')+n('First Touch')+n('Technique'))/3],
    [lang==='tr'?'Zihinsel':'Mental', (n('Anticipation')+n('Decisions')+n('Work Rate'))/3],
    [lang==='tr'?'Savunma':'Defend', (n('Marking')+n('Tackling')+n('Positioning'))/3],
    [lang==='tr'?'Fizik':'Phys', (n('Strength')+n('Stamina')+n('Balance'))/3],
    [lang==='tr'?'Hız':'Speed', (n('Pace')+n('Acceleration')+n('Agility'))/3],
    [lang==='tr'?'Hava':'Aerial', (n('Jumping Reach')+n('Heading'))/2],
    [lang==='tr'?'Vizyon':'Vision', (n('Vision')+n('Passing')+n('Flair'))/3]
  ];
  const cx = 115, cy = 105, R = 72;
  const pt = (i, v) => {
    const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
    const r = (Math.min(20, Math.max(1, v)) / 20) * R;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const poly = vs => vs.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
  const rings = [5, 10, 15, 20].map(v => `<polygon points="${poly(axes.map(()=>v))}" fill="none" stroke="var(--border-strong)" stroke-width="1"/>`).join('');
  const spokes = axes.map((a, i) => {
    const [x, y] = pt(i, 20), [lx, ly] = pt(i, 24.5);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)"/>
            <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="var(--muted)" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="middle">${a[0]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 230 210" style="width:100%;max-width:230px;display:block;margin:0 auto">
    ${rings}${spokes}
    <polygon points="${poly(axes.map(a=>Math.min(20,a[1]+gain)))}" fill="rgba(34,197,94,0.14)" stroke="var(--emerald)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <polygon points="${poly(axes.map(a=>a[1]))}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8"/>
  </svg>`;
}

function renderProfile(data) {
  const pv = document.getElementById('profileView');
  const fields = data.fields || [];
  const fmap = {};
  fields.forEach(x => fmap[x.name] = x.value);
  const name = fmap['Name'] || data.extra?.name || data.extra?.club?.name || data.addr;

  if (data.type === 'Player') {
    const p = data.extra || {};
    const ca = Number(fmap['CA'] || p.ca || 0);
    const pa = Number(fmap['PA'] || p.pa || 0);
    const gain120 = Math.max(0, (pa - ca) * 0.42 / 5.0);
    const isGk = (p.pos || '').startsWith('GK');
    const byG = {};
    fields.forEach(x => (byG[x.group || 'Other'] ||= []).push(x));

    const attrBox = (title, list) => !list.length ? '' : `
      <div class="panel">
        <div class="panel-h"><span>${title}</span></div>
        ${list.map(x => {
          const v = Number(x.value);
          const proj = paPreview && !isNaN(v) && v >= 1 && v <= 20 ? Math.min(20, Math.round(v + gain120)) : null;
          return `<div class="attr-row">
            <span class="attr-name">${esc(x.name)}</span>
            <div>
              <input class="attr-val ${attrClass(v)}" value="${esc(x.value)}" ${!x.writable?'readonly':''}
                onchange="writeField('Player','${data.addr}','${esc(x.name)}',this.value,'${esc(name)}')" />
              ${proj && proj > v ? `<span class="proj">→${proj}</span>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;

    const statusFields = [...(byG['Condition'] || []), ...(byG['Overview'] || []), ...(byG['Contract'] || [])].filter(x => !['Name','CA','PA'].includes(x.name));
    const caPct = Math.min(100, Math.round((ca / 200) * 100));

    pv.innerHTML = `
      <div class="p-hero">
        <div class="p-hero-top">
          <div class="p-hero-id">
            <div class="avatar" style="width:50px;height:50px;font-size:17px">${esc(initials(name))}</div>
            <div>
              <div class="p-hero-name">${esc(name)}</div>
              <div class="p-hero-meta">${esc(p.pos || '-')} · ${esc(p.nation || '-')} · ${p.age ? p.age + (lang==='tr'?' yaşında':' yrs') : ''} (${esc(p.dob || '-')}) · <strong style="color:var(--accent)">${esc(p.club || (lang==='tr'?'Serbest':'Free Agent'))}</strong></div>
            </div>
          </div>
          <div class="p-pills">
            <div class="p-pill"><div class="v" style="color:var(--emerald)">${ca} / ${pa}</div><div class="k">CA / PA</div></div>
            <div class="p-pill"><div class="v" style="color:var(--accent)">${esc(p.bestRole||'-')} ${p.rolePct||0}% → ${p.prPct||0}%</div><div class="k">${t('colRole')} / PR %</div></div>
            <div class="p-pill"><div class="v">${fmtMoney(p.value)}</div><div class="k">${t('val')}</div></div>
            <div class="p-pill"><div class="v">${fmtMoney(p.wage)}/w</div><div class="k">${t('wage')}</div></div>
            <div class="p-pill"><div class="v">${esc(p.contractEnd || '-')}</div><div class="k">${t('contract')}</div></div>
          </div>
        </div>
        <div class="p-actions">
          <button class="btn ${data.frozen?'gold':''}" onclick="runQuick('Player','${data.addr}','toggle_freeze','${esc(name)}')">${data.frozen ? t('unfreeze') : t('freeze')}</button>
          <button class="btn ${shortlist.has(p.uid)?'gold':''}" onclick="toggleShortlist('${esc(p.uid)}')">${shortlist.has(p.uid)?'★':'☆'} ${t('shortlist')}</button>
          <button class="btn emerald" onclick="runQuick('Player','${data.addr}','max_fitness','${esc(name)}')">${t('maxFit')}</button>
          <button class="btn ${paPreview?'active':''}" onclick="paPreview=!paPreview;renderProfile(currentEntity)">${t('paPreview')}</button>
        </div>
      </div>

      <div class="p-grid-4">
        <div class="p-col">
          ${attrBox(isGk ? t('gk') : t('tech'), isGk ? (byG['Goalkeeping']||[]) : (byG['Technical']||[]))}
          <div class="panel">
            <div class="panel-h"><span>${t('presets')}</span></div>
            <div class="preset-grid">
              <button class="btn" onclick="runQuick('Player','${data.addr}','max_personality','${esc(name)}')">${lang==='tr'?'Kişilik tam':'Max Personality'}</button>
              <button class="btn" onclick="runQuick('Player','${data.addr}','world_class','${esc(name)}')">${lang==='tr'?'Dünya yıldızı':'World Class'}</button>
              <button class="btn" onclick="runQuick('Player','${data.addr}','max_pa','${esc(name)}')">${lang==='tr'?'Maksimum PA':'Max PA (200)'}</button>
              <button class="btn" onclick="runQuick('Player','${data.addr}','boost_all_2','${esc(name)}')">${lang==='tr'?'Hepsine +2':'All Attrs +2'}</button>
            </div>
          </div>
        </div>
        <div class="p-col">
          ${attrBox(t('mental'), byG['Mental']||[])}
          ${attrBox(t('hidden'), byG['Hidden']||[])}
        </div>
        <div class="p-col">
          ${attrBox(t('physical'), byG['Physical']||[])}
          ${attrBox(t('personality'), byG['Personality']||[])}
        </div>
        <div class="p-col">
          <div class="panel">
            <div class="panel-h"><span>${t('ability')}</span></div>
            <div class="kv-edit"><label>CA</label><input value="${ca}" ${readOnly?'readonly':''} onchange="writeField('Player','${data.addr}','CA',this.value,'${esc(name)}')" /></div>
            <div class="kv-edit"><label>PA</label><input value="${pa}" ${readOnly?'readonly':''} onchange="writeField('Player','${data.addr}','PA',this.value,'${esc(name)}')" /></div>
            <div class="capa-bar-wrap" style="margin-top:8px">
              <div class="capa-bar-top"><span>CA ${ca} / PA ${pa}</span><span style="color:var(--emerald)">+${Math.max(0,pa-ca)}</span></div>
              <div class="capa-bar"><div class="capa-fill" style="width:${caPct}%"></div></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-h"><span>${t('status')}</span></div>
            ${statusFields.slice(0, 10).map(x => `<div class="kv-edit"><label>${esc(x.name)}</label><input value="${esc(x.value)}" ${!x.writable?'readonly':''} onchange="writeField('Player','${data.addr}','${esc(x.name)}',this.value,'${esc(name)}')" /></div>`).join('')}
          </div>
          <div class="panel">
            <div class="panel-h"><span>${t('radar')}</span></div>
            ${buildRadarSvg(fmap, ca, pa, isGk)}
          </div>
        </div>
      </div>`;
    return;
  }

  if (data.type === 'Club') {
    const squad = data.extra?.squad || [];
    const facNames = ['Training Facilities','Youth Facilities','Youth Coaching','Youth Recruitment','Corporate Facilities'];
    const facFields = fields.filter(x => facNames.includes(x.name));
    const otherFields = fields.filter(x => x.name !== 'Name' && !facNames.includes(x.name));
    pv.innerHTML = `
      <div class="p-hero">
        <div class="p-hero-top">
          <div class="p-hero-id">
            <div class="avatar" style="width:48px;height:48px">${esc(initials(name))}</div>
            <div><div class="p-hero-name">${esc(name)}</div><div class="p-hero-meta">${t('colRep')}: ${esc(fmap['Reputation']||'-')} · ${squad.length} ${t('players').toLowerCase()}</div></div>
          </div>
        </div>
        <div class="p-actions">
          <button class="btn emerald" onclick="runQuick('Club','${data.addr}','bal_50','${esc(name)}')">+€50M ${t('colBal')}</button>
          <button class="btn emerald" onclick="runQuick('Club','${data.addr}','tb_50','${esc(name)}')">+€50M ${t('colTb')}</button>
          <button class="btn gold" onclick="runQuick('Club','${data.addr}','rich_club','${esc(name)}')">💰 ${lang==='tr'?'Zengin Kulüp':'Rich Owner'}</button>
          <button class="btn active" onclick="runQuick('Club','${data.addr}','max_facilities','${esc(name)}')">🏟️ Max Tesisler (20)</button>
        </div>
      </div>
      <div class="kpi-4">
        <div class="kpi-box"><div class="k">${t('colBal')}</div><div class="v">${fmtMoney(fmap['Balance'])}</div></div>
        <div class="kpi-box"><div class="k">${t('colTb')}</div><div class="v" style="color:var(--emerald)">${fmtMoney(fmap['Transfer Budget'])}</div></div>
        <div class="kpi-box"><div class="k">${t('wage')}</div><div class="v">${fmtMoney(fmap['Wage Budget'])}</div></div>
        <div class="kpi-box"><div class="k">${t('facilities')}</div><div class="v" style="color:var(--accent)">${esc(fmap['Training Facilities']||'-')} / ${esc(fmap['Youth Facilities']||'-')}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="panel">
          <div class="panel-h"><span>${t('facilities')}</span></div>
          ${facFields.map(x => `<div class="fac-row"><span class="fac-lbl">${esc(x.name)}</span><div class="fac-bar"><div class="fac-fill" style="width:${Math.min(100,Number(x.value||0)*5)}%"></div></div><input class="attr-val ${attrClass(x.value)}" value="${esc(x.value)}" ${!x.writable?'readonly':''} onchange="writeField('Club','${data.addr}','${esc(x.name)}',this.value,'${esc(name)}')" /></div>`).join('')}
        </div>
        <div class="panel">
          <div class="panel-h"><span>${t('overview')}</span></div>
          ${otherFields.map(x => `<div class="kv-edit"><label>${esc(x.name)}</label><input value="${esc(x.value)}" ${!x.writable?'readonly':''} onchange="writeField('Club','${data.addr}','${esc(x.name)}',this.value,'${esc(name)}')" /></div>`).join('')}
        </div>
      </div>
      ${squad.length ? `<div class="panel">
        <div class="panel-h"><span>${t('squad')} (${squad.length})</span></div>
        <table class="grid"><thead><tr><th>${t('colPlayer')}</th><th>${t('colPos')}</th><th>${t('colAge')}</th><th>CA</th><th>PA</th><th>${t('colRole')}</th><th>${t('colPr')}</th></tr></thead>
        <tbody>${squad.map(p => `<tr onclick="openProfile('Player','${p.addr}')"><td class="td-name">${esc(p.name)}</td><td>${esc(p.pos)}</td><td>${p.age||'-'}</td><td class="td-ca">${p.ca}</td><td class="td-pa">${p.pa}</td><td>${esc(p.bestRole)} ${p.rolePct}%</td><td class="td-ca">${p.prPct}%</td></tr>`).join('')}</tbody></table>
      </div>` : ''}`;
    return;
  }

  pv.innerHTML = `
    <div class="p-hero">
      <div class="p-hero-top">
        <div class="p-hero-id"><div class="avatar">${esc(initials(name))}</div><div><div class="p-hero-name">${esc(name)}</div><div class="p-hero-meta">${esc(fmap['Club'] || data.type)}</div></div></div>
      </div>
      ${data.type==='Competition' ? `<div class="p-actions"><button class="btn gold" onclick="runQuick('Competition','${data.addr}','world_no1','${esc(name)}')">🏆 ${lang==='tr'?'Dünya #1 Ligi Yap (Rep 200)':'World #1 League (Rep 200)'}</button></div>` : ''}
    </div>
    <div class="panel">
      <div class="panel-h"><span>${t('overview')}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px">
        ${fields.filter(x => x.name !== 'Name').map(x => `<div class="kv-edit"><label>${esc(x.name)}</label><input value="${esc(x.value)}" ${!x.writable?'readonly':''} onchange="writeField('${data.type}','${data.addr}','${esc(x.name)}',this.value,'${esc(name)}')" /></div>`).join('')}
      </div>
    </div>`;
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); doUndo(); }
  if (e.key === 'Escape') { closeSettings(); }
});

setTheme(theme);
applyI18n();
refreshStatus().then(loadList);
setInterval(refreshStatus, 5000);
</script>
